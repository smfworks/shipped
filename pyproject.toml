[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shipped"
version = "0.1.0"
description = "Release management CLI — bump versions, generate changelogs, tag releases, push to GitHub and PyPI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "SMF Works", email = "dev@smfworks.com" }]
keywords = ["release", "changelog", "version", "publish", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "tomli-w>=1.0; python_version < '3.11'",
    "gitpython>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
shipped = "shipped.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/shipped"]

[tool.pytest.ini_options]
testpaths = ["tests"]